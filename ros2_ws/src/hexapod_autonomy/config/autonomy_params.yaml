# Autonomy System Configuration

autonomy_manager:
  ros__parameters:
    # Time to wait for external mission before auto-exploring
    mission_timeout_sec: 60.0
    # Head survey (LookAround, head_controller) before exploring: sweeps.
    # Rejected while the head is disabled (OQ-30); the state machine goes on.
    survey_sweeps: 2
    # State publish rate
    state_publish_rate_hz: 2.0

frontier_explorer:
  ros__parameters:
    # Minimum frontier size to consider (meters)
    min_frontier_size: 0.3
    # Goal tolerance for navigation
    goal_tolerance: 0.3
    # Maximum exploration time per session
    exploration_timeout_sec: 300.0
    # Goal selection strategy: "closest" or "largest"
    goal_selection_strategy: "closest"
    # OccupancyGrid value thresholds
    unknown_threshold: -1
    free_threshold: 50
    # Failed goals in a row before a pause of retry_wait_sec (not an abort)
    max_nav_failures: 3
    # With no reachable frontier, or after max_nav_failures, wait this long
    # (s) and retry with the failed goals forgotten (OQ-34)
    retry_wait_sec: 30.0
    # A frontier's goal is the reachable costmap cell nearest its cells; with
    # none within this (m) the frontier is skipped as unreachable (OQ-34)
    max_goal_offset: 1.0
    # The map: Nav2's global costmap, which is slam_toolbox's /map plus live
    # lidar obstacles and inflation (nav2_params.yaml, DEC-32)
    map_topic: "/global_costmap/costmap"
    # How long a first map with no frontier counts as "not ready yet"
    initial_map_timeout_sec: 60.0
    # Head survey at each reached frontier; 0 disables. The head is disabled
    # (OQ-30), so the survey is skipped.
    survey_sweeps: 0
    # Ignore frontiers nearer than this (m): the unseen cells beside the body
    min_goal_distance: 0.4

mission_server:
  ros__parameters:
    # Navigation timeout per waypoint
    navigation_timeout_sec: 120.0
    # Return to start on abort
    return_home_on_abort: true
