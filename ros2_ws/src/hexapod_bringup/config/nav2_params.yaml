# Nav2 Parameters for Hexapod Robot
# Tuned for a slow-moving hexapod. The range sensor is the RPLIDAR C1 (/scan,
# 360 deg at 10 Hz). slam_toolbox builds /map from it and publishes map -> odom
# (DEC-32); the global costmap is /map plus live obstacles and inflation. The
# head's sonar is not a source (DEC-32); it publishes /ultrasonic/range only.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # 1000 ms, not the 20 ms default: at boot load (~15) the planner missed the
    # acknowledge window on every replan and each goal aborted (test-log 2026-09-15).
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    # The packaged default tree clears the global costmap in recovery, which
    # here would erase the map, and spins the body to look. This one does
    # neither (see the file). Never set an empty string: it loads an empty tree.
    default_nav_to_pose_bt_xml: "$(find-pkg-share hexapod_bringup)/config/behavior_trees/navigate_to_pose_sonar.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share hexapod_bringup)/config/behavior_trees/navigate_through_poses_sonar.xml"
    # Jazzy loads the default BT node libraries itself; listing them here
    # registers them twice and crashes bt_navigator (ID already registered).

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0  # Lower for hexapod
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Arrival is a position. The head looks wherever it needs to, so the
      # body does not turn in place to a goal heading (yaw tolerance = pi).
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.05  # Slow for hexapod
      lookahead_dist: 0.2
      min_lookahead_dist: 0.1
      max_lookahead_dist: 0.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.3
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.02
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      # Turn to face a path before walking it. Kept from the sonar stack; the
      # lidar sees all round, so strafing instead is open (OQ-16).
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Foot tips reach 0.225 m from the body centre at the default stance
      # (hardware.md, leg geometry); the old 0.15 was the body alone.
      robot_radius: 0.24
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          max_obstacle_height: 2.0
          # Nearer returns are the robot itself (slam_params.yaml uses the same
          # figure); 0.25 m is inside robot_radius either way.
          obstacle_min_range: 0.25
          # Short of the C1's 12 m: the scan plane tilts with the gait, and at
          # 0.21 m above the floor (50 mm stand, DEC-34) a 3 deg pitch meets the
          # floor at 4.0 m.
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.24
      resolution: 0.05
      # Sized by the static layer from slam_toolbox's /map, and grows with it.
      # The frontier explorer and the dashboard read /global_costmap/costmap;
      # unknown cells stay unknown, which is what makes a frontier.
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          max_obstacle_height: 2.0
          # Nearer returns are the robot itself (slam_params.yaml uses the same
          # figure); 0.25 m is inside robot_radius either way.
          obstacle_min_range: 0.25
          # Short of the C1's 12 m: the scan plane tilts with the gait, and at
          # 0.21 m above the floor (50 mm stand, DEC-34) a 3 deg pitch meets the
          # floor at 4.0 m.
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    # Smac 2D, not NavFn: standing 0.35 m from an obstacle (start cell cost 80)
    # NavFn found a potential and then no path, to any goal (test-log 2026-09-29).
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.15
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    # No spin: the head does the looking (the BT has no Spin node either)
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [x, y, theta]. The gait's ceiling at cycle_time 1.0 is 0.14 m/s and
    # 0.7 rad/s (body_params.yaml, DEC-22); stay under it.
    max_velocity: [0.1, 0.0, 0.5]
    min_velocity: [-0.1, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Required by Jazzy navigation_launch.py (collision_monitor and docking_server
# are lifecycle-managed and must configure).
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    # Generous for Pi load (OQ-02); a short timeout made the monitor flap.
    source_timeout: 3.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Both polygons reach past the feet (0.225 m). The lidar covers them all
    # round; returns from the robot itself would hold it stopped (OQ-31).
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      points: "[[0.32, 0.25], [0.32, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      action_type: "stop"
      min_points: 1
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "polygon"
      points: "[[0.50, 0.30], [0.50, -0.30], [-0.25, -0.30], [-0.25, 0.30]]"
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 1
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    # No docks defined yet (return-to-home charging is future work). An empty
    # docks list aborts opennav_docking (untyped empty parameter), so leave it unset.
